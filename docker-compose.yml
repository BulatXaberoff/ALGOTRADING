version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: StrongPassword_123!
      MINIO_LICENSE_FILE: /licenses/minio.license
    volumes:
      - minio_data:/data
      - ./minio.license:/licenses/minio.license:ro
    command: server /data --console-address ":9001"

volumes:
  minio_data:
