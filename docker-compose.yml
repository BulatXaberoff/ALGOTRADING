version: "3.8"

services:

  hive-metastore:
    build:
      context: ./hive-metastore
      args:
        HADOOP_AWS_VER: "3.1.0"
        AWS_SDK_BUNDLE_VER: "1.11.375"
    image: algotrading-hive-metastore:3.1.3-s3a
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      HIVE_METASTORE_WAREHOUSE_DIR: s3://datalake/warehouse

      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      HIVE_S3_ENDPOINT: ${S3_ENDPOINT}
      HIVE_S3_PATH_STYLE_ACCESS: "true"
      AWS_REGION: ${S3_REGION}
      HADOOP_OPTS: -Dfs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem -Dfs.s3n.impl=org.apache.hadoop.fs.s3a.S3AFileSystem -Dfs.s3a.path.style.access=true -Dfs.s3a.endpoint=https://s3.ru1.storage.beget.cloud -Dfs.s3a.region=ru1 -Dfs.s3a.connection.ssl.enabled=true -Dfs.s3a.aws.credentials.provider=com.amazonaws.auth.DefaultAWSCredentialsProviderChain
    ports:
      - "9083:9083"

    networks:
      - dlh-net


  trino:
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"

    volumes:
    - ./trino/catalog:/etc/trino/catalog
    - ./trino/config.properties:/etc/trino/config.properties
    - ./trino/filesystem:/etc/trino/filesystem

    networks:
      - dlh-net

    depends_on:
      - hive-metastore


networks:
  dlh-net:
    driver: bridge